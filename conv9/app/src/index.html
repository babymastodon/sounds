<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>conv9 listener</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="masthead">
        <h1>conv9</h1>
        <div class="method-field">
          <span class="field-label">method</span>
          <div id="algorithmButtons" class="segmented"></div>
        </div>
        <span id="renderStatus">loading…</span>
      </header>

      <section class="clip-selectors" aria-label="Convolution sources">
        <select
          id="sourceASelect"
          aria-label="Clip A"
          title="Choose the first convolution source. Changing clip A cancels stale work and renders the selected method again with this signal as input A."
        ></select>
        <select
          id="sourceBSelect"
          aria-label="Clip B"
          title="Choose the second convolution source. Changing clip B cancels stale work and renders the selected method again with this signal as input B."
        ></select>
      </section>

      <section class="method-panel" aria-label="Selected method controls">
        <header>
          <span id="methodToolTitle">method parameters</span>
        </header>
        <div id="methodTools" class="method-tools"></div>
      </section>

      <section class="now-playing">
        <div>
          <h2 id="renderTitle">—</h2>
          <span id="windowReadout"></span>
        </div>
        <dl class="metrics" id="metrics"></dl>
      </section>

      <section class="transport-panel">
        <div class="transport">
          <button
            id="playButton"
            class="play"
            type="button"
            disabled
            aria-label="Play"
            title="Playback becomes available after the first convolution and its visualizations are ready."
          >▶</button>
          <span id="currentTime">0:00.000</span>
          <input
            id="seek"
            type="range"
            min="0"
            max="0"
            value="0"
            step="0.001"
            disabled
            aria-label="Seek"
            title="Move through the complete rendered duration once audio is ready. The waveform and spectrogram cursors follow this exact time."
          />
          <span id="duration">0:00.000</span>
          <label class="transport-control volume">
            <span>vol</span>
            <input
              id="volume"
              type="range"
              min="0"
              max="1"
              value="0.8"
              step="0.01"
              aria-label="Playback volume"
              title="Adjust listener playback volume only. This does not alter convolution rendering, output conditioning, metrics, or waveform data."
            />
          </label>
          <label class="transport-control playback-speed">
            <span>spd</span>
            <input
              id="playbackSpeed"
              type="range"
              min="-1"
              max="1"
              value="0"
              step="0.01"
              aria-label="Playback speed"
              title="Adjust listening speed from half speed to double speed on an octave-logarithmic scale, with 1× exactly at the visual midpoint. Pitch is preserved where supported; this does not re-render or modify the waveform."
            />
            <output id="playbackSpeedValue" for="playbackSpeed">1.00×</output>
          </label>
        </div>
        <audio id="audio" preload="auto" loop></audio>
      </section>

      <section class="visuals">
        <article class="visual-card">
          <header><span>waveform</span></header>
          <canvas
            id="waveform"
            height="220"
            aria-label="Audio waveform"
            title="Shows output amplitude over the complete rendered duration. Click anywhere to seek playback to that timeline position."
          ></canvas>
        </article>
        <article class="visual-card spectrogram-card">
          <header><span>spectrum / 16384 fft</span></header>
          <canvas
            id="spectrogram"
            height="300"
            aria-label="Audio spectrum"
            title="Shows output energy over time on a logarithmic 50 Hz–20 kHz axis using a 16,384-point FFT. Click anywhere to seek."
          ></canvas>
        </article>
      </section>
    </main>

    <div id="errorPanel" class="error-panel" hidden></div>
    <script src="app.js"></script>
  </body>
</html>

[package]
name = "conv9"
version = "0.1.0"
edition = "2024"
description = "On-demand local and full convolution over a diverse 48-source corpus"
license = "MIT"

[dependencies]
anyhow = "1.0"
csv = "1.3"
hound = "3.5"
realfft = "3.5"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1

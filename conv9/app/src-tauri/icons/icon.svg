<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Impulse Loom</title>
  <desc id="desc">Two audio signals cross and emerge as one convolved waveform.</desc>

  <rect width="512" height="512" fill="#171b1a"/>
  <rect x="16" y="16" width="480" height="480" fill="none" stroke="#252b29" stroke-width="8"/>

  <!-- The two source signals. -->
  <path
    d="M40 158h30l10-31 15 67 17-109 18 145 18-105 15 69 12-36h27"
    fill="none"
    stroke="#a9b68f"
    stroke-width="18"
    stroke-linecap="square"
    stroke-linejoin="miter"
  />
  <path
    d="M40 354h30l10-24 15 51 17-84 18 112 18-81 15 53 12-27h27"
    fill="none"
    stroke="#55c3c8"
    stroke-width="18"
    stroke-linecap="square"
    stroke-linejoin="miter"
  />

  <!-- Dark keylines keep the crossing readable at small desktop-icon sizes. -->
  <path d="M178 158h27l137 154h24" fill="none" stroke="#171b1a" stroke-width="54"/>
  <path d="M178 354h27l137-154h24" fill="none" stroke="#171b1a" stroke-width="54"/>
  <path
    d="M178 158h27l137 154h24"
    fill="none"
    stroke="#a9b68f"
    stroke-width="30"
    stroke-linecap="square"
    stroke-linejoin="miter"
  />
  <path
    d="M178 354h27l137-154h24"
    fill="none"
    stroke="#55c3c8"
    stroke-width="30"
    stroke-linecap="square"
    stroke-linejoin="miter"
  />

  <!-- The convolution point and the resulting signal. -->
  <rect x="244" y="232" width="48" height="48" transform="rotate(45 268 256)" fill="#e18862"/>
  <path
    d="M350 256h25l8-32 12 69 14-125 16 176 15-139 14 94 12-43h14"
    fill="none"
    stroke="#d9e7c2"
    stroke-width="18"
    stroke-linecap="square"
    stroke-linejoin="miter"
  />
</svg>
